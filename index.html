<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TikTok Follower Goal</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=DM+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            overflow: hidden;
            padding: 12px;
            font-family: 'DM Sans', sans-serif;
        }

        #widget {
            width: 620px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Track — ocupa tudo */
        .track {
            width: 100%;
            height: 52px;
            background: rgba(22, 24, 30, 0.93);
            border-radius: 12px;
            border: 1px solid rgba(60, 113, 221, 0.25);
            position: relative;
            overflow: hidden;
        }

        /* Barra de progresso ocupa 100% visualmente mas reflete o % real */
        #progress-bar {
            position: absolute;
            left: 0; top: 0;
            height: 100%;
            width: 0%;
            border-radius: 12px;
            background: linear-gradient(90deg, #3c71dd 0%, #7b5fd4 50%, #ed5ea6 100%);
            transition: width 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Shimmer */
        #progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: -80%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
            animation: shimmer 2.6s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -60%; }
            100% { left: 130%; }
        }

        /* Texto em cima de tudo */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            z-index: 10;
            pointer-events: none;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fff;
            flex-shrink: 0;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,255,255,0.5); }
            50% { opacity: 0.75; box-shadow: 0 0 0 4px rgba(255,255,255,0.15); }
        }

        .label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 6px rgba(0,0,0,0.5);
            white-space: nowrap;
            text-transform: uppercase;
        }

        .right {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        #current-count {
            font-family: 'DM Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
            line-height: 1;
        }

        .separator {
            font-family: 'DM Mono', monospace;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.45);
            line-height: 1;
        }

        .goal {
            font-family: 'DM Mono', monospace;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.55);
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="widget">
        <div class="track">
            <div id="progress-bar"></div>
        </div>
        <div class="overlay">
            <div class="left">
                <span class="live-dot"></span>
                <span class="label">Pessoas que não são substituídas pela IA</span>
            </div>
            <div class="right">
                <span id="current-count">0</span>
                <span class="separator">/</span>
                <span class="goal">2.500</span>
            </div>
        </div>
    </div>

    <script>
        const META = 2500;
        const URL_PLANILHA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkV1b9JES3HSOkTyolIOEzbYMDq6dH12l_xAIsaWa9Qpo7ZLX5f_m8gEN7F2_D4xeWATS9sYALzGnP/pub?output=csv';
        const CSV_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(URL_PLANILHA)}`;
        let lastValue = -1;

        async function buscarDados() {
            try {
                const res = await fetch(CSV_URL);
                const data = await res.json();
                const decoded = decodeURIComponent(escape(atob((data.contents.split(',')[1] || data.contents))));
                const linhas = decoded.split('\n');
                if (linhas.length > 1) {
                    const val = parseInt(linhas[1].split(',')[0].trim());
                    if (!isNaN(val)) update(val);
                }
            } catch (e) { console.error(e); }
        }

        function update(n) {
            if (n === lastValue) return;
            lastValue = n;
            const pct = Math.min((n / META) * 100, 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('current-count').textContent = n.toLocaleString('pt-BR');
        }

        buscarDados();
        setInterval(buscarDados, 30000);
    </script>
</body>
</html>
