<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TikTok Follower Goal - Minimalist</title>
    <style>
        body {
            background-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }

        #widget-container {
            width: 600px; /* Mais horizontal */
            position: relative;
        }

        .progress-bg {
            width: 100%;
            height: 40px; /* Barra mais robusta para caber o texto */
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #fe2c55;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            align-items: center;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #fe2c55, #25f4ee);
            transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            z-index: 1;
        }

        /* Camada de texto centralizada */
        .text-overlay {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 2; /* Fica acima da barra colorida */
            color: white;
            font-weight: 800;
            font-size: 14px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* Não interfere em cliques */
            letter-spacing: 0.5px;
        }

        #counter {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .glow {
            position: absolute;
            right: 0;
            width: 5px;
            height: 100%;
            background: white;
            box-shadow: 0 0 10px white;
        }
    </style>
</head>

<body>
    <div id="widget-container">
        <div class="progress-bg">
            <div class="text-overlay">
                <span>PESSOAS QUE NÃO SÃO SUBSTITUÍDAS PELA IA</span>
                <span id="counter">0 / 2500</span>
            </div>
            
            <div id="progress-bar">
                <div class="glow"></div>
            </div>
        </div>
    </div>

    <script>
        const metaSeguidores = 2500;
        const URL_PLANILHA = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkV1b9JES3HSOkTyolIOEzbYMDq6dH12l_xAIsaWa9Qpo7ZLX5f_m8gEN7F2_D4xeWATS9sYALzGnP/pub?output=csv';
        const CSV_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(URL_PLANILHA)}`;

        async function buscarDadosDaPlanilha() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.json();
                let dataEncoded = data.contents;
                
                // Decodificação Base64
                let dataDecoded = decodeURIComponent(escape(atob(dataEncoded.split(',')[1] || dataEncoded)));
                
                const linhas = dataDecoded.split('\n');
                if (linhas.length > 1) {
                    const valores = linhas[1].split(',');
                    // Note: Ajustado para valores[0] conforme seu código anterior
                    const seguidoresAtuais = parseInt(valores[0].trim());

                    if (!isNaN(seguidoresAtuais)) {
                        updateGoal(seguidoresAtuais);
                    }
                }
            } catch (error) {
                console.error("Erro ao buscar dados:", error);
            }
        }

        function updateGoal(currentFollowers) {
            const counter = document.getElementById('counter');
            const progressBar = document.getElementById('progress-bar');

            let percentage = (currentFollowers / metaSeguidores) * 100;
            if (percentage > 100) percentage = 100;

            progressBar.style.width = percentage + '%';
            counter.innerText = `${currentFollowers} / ${metaSeguidores}`;
        }

        // Execução
        buscarDadosDaPlanilha();
        setInterval(buscarDadosDaPlanilha, 30000);
    </script>
</body>
</html>
